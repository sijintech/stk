name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Update the release asset ID and digest together with the version.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_ASSET: '378332058'
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          asset_api=https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_LINUX_X64_ASSET}
          download=(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90)
          trap 'rm -f -- "$archive.part"' EXIT
          if ! "${download[@]}" --output "$archive.part" "$base/$archive"; then
            echo 'Release download failed; trying the pinned GitHub API asset.'
            "${download[@]}" --retry 2 --retry-all-errors --header 'Accept: application/octet-stream' \
              --output "$archive.part" "$asset_api"
          fi
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive.part" | sha256sum --check --strict -
          tar xzf "$archive.part" gitleaks
      # Scan only the commits this event adds; older history is audited separately.
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          ./gitleaks git --redact --no-banner --log-opts="$range" .
