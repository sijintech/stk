name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar xzf "$archive" gitleaks
      # Scan only the commits this event adds; older history is audited separately.
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          ./gitleaks git --redact --no-banner --log-opts="$range" .
