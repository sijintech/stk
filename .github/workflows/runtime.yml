name: Runtime and scientific workflow checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # The STK server Runtime (API, supervisor, workers, schedulers) is Linux-only.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    # A hung test fails the job instead of running to GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every non-desktop test runs here, including control, workbench and MuPRO end-to-end tests.
      - run: python -m pip install ".[server,science,control,visualization,test]" build
      - run: python -m pytest -m "not desktop" -rs
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.python }}
          path: dist/*
  # Windows is client-only: CLI, RuntimeClient and science tools against a Linux runtime.
  client-windows:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[science,test]"
      # No PYTHONUTF8 or PYTHONIOENCODING, so the cp1252 pipes are exercised.
      - run: python -m pytest -m "not server and not desktop" -rs
      - name: Client entry points and server refusal
        shell: bash
        run: |
          suan --help > help.txt
          grep -q jobs help.txt
          grep -q mupro help.txt
          suan mupro submit --help
          suan jobs submit --help
          suan workspaces upload --help
          suan-workbench --help
          suan connect list
          # The server Runtime and control service must refuse to initialize and create nothing.
          out=$(suan server --state-dir "$RUNNER_TEMP/stk-state" init 2>&1) && exit 1
          echo "$out" | grep -q 'Linux only'
          test ! -e "$RUNNER_TEMP/stk-state"
          out=$(suan-control init --state-dir "$RUNNER_TEMP/stk-control" 2>&1) && exit 1
          echo "$out" | grep -q 'Linux only'
          test ! -e "$RUNNER_TEMP/stk-control"
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: /tmp/stk-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,test,mcp]"
      - run: python -m pytest tests/test_desktop.py tests/test_mcp.py
  control-and-blender-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[control,visualization,test]"
      - run: python -m pytest tests/test_control.py tests/test_control_model.py tests/test_visualization.py tests/test_blender_client.py tests/test_workbench_mupro.py tests/test_integration_mupro.py
