name: Runtime and scientific workflow checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[server,science,test]" build
      - run: python -m pytest -m "not desktop"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: /tmp/stk-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ".[desktop,test,mcp]"
      - run: python -m pytest tests/test_desktop.py tests/test_mcp.py
  control-and-blender-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[control,visualization,test]"
      - run: python -m pytest tests/test_control.py tests/test_control_model.py tests/test_visualization.py tests/test_blender_client.py
