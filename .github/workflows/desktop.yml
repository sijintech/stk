# SPDX-License-Identifier: GPL-2.0-or-later
#
# STK desktop engine (desktop/, GPL-2.0-or-later): build, test and package on GitHub-hosted runners.
#
#   linux         : Ubuntu 26.04 container (the package set the engine is developed against), full
#                   build, vendoring / Phase 0 go-criteria checks, all ctests: headless GPU goldens on
#                   Mesa lavapipe (Vulkan) and llvmpipe (OpenGL/EGL), live windows on Xvfb and a
#                   headless weston (unix sockets only, inside the job container). A venv with STK's
#                   runtime, science, visualization and control extras backs the real-bridge tests,
#                   the loopback-Runtime Jobs test and the e2e golden; they must run, not skip.
#   linux-package : Ubuntu 24.04 container (the oldest supported glibc): relocatable Release build,
#                   CPack tarball with the non-system libraries bundled (shaderc, libepoxy).
#   linux-package-smoke : a fresh Ubuntu 24.04 container with only the runtime libraries a desktop
#                   has: unpack the tarball, render headless (OpenGL and Vulkan) and run the e2e
#                   preset command against a venv with `pip install` of the repository.
#   macos         : arm64, Cocoa + Metal, full build; CPU, CLI, UI and bridge tests (with the venv);
#                   headless Metal goldens, viewer and e2e tests on the runner's paravirtual Metal
#                   device; STK.app (unsigned, ad-hoc signed), zipped, then run headless from the zip.
#   windows       : MSVC build of every target (OpenGL backend, Win32 GHOST); CPU, CLI, UI and bridge
#                   tests. A separate native-preview job attempts real STK child composition and
#                   fails explicitly when this runner lacks OpenGL/WGC/Runtime capabilities.
#                   Packaging is milestone M-D2.
#
# No secrets are used; the token is read-only; actions are pinned by commit SHA.

name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "suan/**"
      - "tests/mupro_fake.py"
      - "examples/project_scan/**"
      - "examples/project_analysis/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
      - feature/desktop-engine
      - "ci/desktop-*"
    paths:
      - "desktop/**"
      - "suan/**"
      - "tests/mupro_fake.py"
      - "examples/project_scan/**"
      - "examples/project_analysis/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 26.04, GL + Vulkan, X11 + Wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      # ubuntu:26.04, pinned by digest (multi-arch index).
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
      # An init as PID 1 reaps orphans: the default `tail -f /dev/null` does not, and the bridge
      # tests' killed process groups would then stay alive as zombies.
      options: --init
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      STK_VENV: /opt/stk-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies and software GPU drivers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates g++ cmake ninja-build python3 python3-venv \
            libx11-dev libxi-dev libxfixes-dev libxrender-dev libxxf86vm-dev libxext-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev libdbus-1-dev \
            libepoxy-dev libegl-dev libgl-dev libgles-dev libglx-dev libopengl-dev \
            libfreetype-dev libbrotli-dev libpng-dev zlib1g-dev libzstd-dev libeigen3-dev libfmt-dev \
            libvulkan-dev libshaderc-dev glslang-dev spirv-headers \
            mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri libglx-mesa0 \
            xvfb weston

      - name: Python for the bridge tests (runtime, science, visualization and control extras)
        run: |
          set -euo pipefail
          python3 -m venv "$STK_VENV"
          "$STK_VENV/bin/python" -m pip install ".[science,visualization,control,documents,test]"
          PYTHONPATH="$PWD/desktop/tests/bridge" "$STK_VENV/bin/python" desktop/tests/bridge/bridge_fixture.py check graph
          PYTHONPATH="$PWD/desktop/tests/bridge" "$STK_VENV/bin/python" desktop/tests/bridge/bridge_fixture.py check runtime

      - name: Vendoring and Phase 0 go criteria
        run: |
          set -euo pipefail
          bl=desktop/engine/third_party/blender
          python3 "$bl/vendor.py" --check
          patches=$(find "$bl/patches" -name '*.patch' | wc -l)
          shim_lines=$(cat "$bl"/shims/* | wc -l)
          forbidden=0
          for module in draw imbuf blenkernel nodes; do
            if [ -d "$bl/src/source/blender/$module" ]; then
              n=$(find "$bl/src/source/blender/$module" \( -name '*.cc' -o -name '*.c' -o -name '*.mm' \) | wc -l)
              forbidden=$((forbidden + n))
            fi
          done
          echo "patches=$patches (max 3), shim lines=$shim_lines (max ~800), draw/imbuf/blenkernel/nodes .cc=$forbidden (max 0)"
          test "$patches" -le 3
          test "$shim_lines" -le 800
          test "$forbidden" -eq 0

      - name: Configure
        # No user sysroot on CI: system packages are used (STK_SYSROOT does not exist).
        run: |
          cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTK_SYSROOT=/nonexistent \
            -DSTK_DESKTOP_ENABLE_NATIVE_DOCUMENT_PREVIEW=ON \
            -DSTK_DESKTOP_BUILD_DOCUMENT_PREVIEW_SPIKE=ON \
            -DSTK_BRIDGE_TEST_PYTHON="$STK_VENV/bin/python" -DSTK_APP_TEST_PYTHON="$STK_VENV/bin/python"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless GPU goldens, live windows on Xvfb and weston, real Python bridge)
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout 600 --output-junit "$PWD/build/ctest-junit.xml"

      - name: The Python-backed tests ran (none skipped)
        if: success() || failure()
        run: |
          python3 desktop/tests/check_required_tests.py build/ctest-junit.xml \
            'native_evidence_gate' 'ReportDocumentHost\..*' 'NativeViewport\..*' 'NativeViewInvalidation\..*' 'AreaRemoval\..*' 'ProjectScopeNotifications\..*' 'document_preview_memory_.*' 'Schema\.ReportsSourceReviewAndOptionalCompareAndSwap' 'Schema\.ReportsPreviewResources' 'DocumentResources\..*' 'DocumentEvidence\..*' 'ReportsPreviewPython\..*' 'ReportGenerationPython\..*' 'LanguagesAndWidths/ReportGenerationMouse\..*' 'Receipts/ReportsPreviewInvalid\..*' 'Generation/ReportsGeneratedInvalid\..*' 'Receipts/ReportsPdfInvalid\..*' 'Scopes/ReportsPdfInvalidation\..*' 'LayoutObserver(Test|Lifetime)\..*' \
            'PythonBridge\..*' 'ProjectPython\..*' 'LammpsProjectPython\..*' 'ProjectStream\..*' 'ProjectLegacyStream\..*' 'ProjectProposal\..*' 'AgentPython\..*' 'ModulesPython\..*' 'SavedReviewPython\..*' 'ProjectScope\..*' 'ProjectContextSelection\..*' 'FocusNavigation\..*' 'WorkModeLayouts\..*' 'LanguagesAndScale/WorkModeLayoutClicks\..*' 'TreeFixture\.Arrangement.*' 'WorkspaceNavigation(Python)?\..*' 'SkillCatalog\..*' 'SkillsCatalogPython\..*' 'ProjectSkillsPython\..*' 'AnalysisGraphView\..*' 'AnalysisGraphCanvas\..*' 'ViewerGraphInspection(Test)?\..*' 'AnalysisGraphState\..*' 'AnalysisGraphPython\..*' 'AnalysisGraphCatalogPython\..*' 'Configuration/AnalysisGraphStale\..*' 'AnalysisGraphEditor(Test|Python)\..*' 'Camera\..*' 'LabelBackdrop\..*' 'ScalarVolumePython\..*' 'VolumeFloatTexture\..*' 'FormSchema\.(JsonDeclarationsKeepTypedDefaultsAfterReferenceSpecialization|NullabilityIntersectsDeclarationAndEveryReferenceInEitherOrder)' 'FormBuilder\.ScalarVolumeNullableUnitAndStrictFieldRoundTrip' 'ViewerGraphConfiguration(Test|Python)\..*' 'AnalysisDocumentsEditor\..*' 'AnalysisParameterDraft\..*' 'AnalysisOutputDraft\..*' 'AnalysisInputReuse\..*' 'AnalysisResultInspection\..*' 'AnalysisResultInspectionEditorPython\..*' 'AnalysisTableGrid\..*' 'AnalysisTableGridEditorPython\..*' 'Json\..*' 'Region\..*' 'AnalysisInputReuseEditorPython\..*' 'AnalysisOutputsEditorPython\..*' 'AnalysisParametersEditorPython\..*' 'AnalysisLinkDraft\..*' 'AnalysisCandidateValidation\..*' 'AnalysisLinksEditorPython\..*' 'WorkflowView\..*' 'WorkflowDraft\..*' 'WorkflowEditorPython\..*' 'ProjectFiles\..*' 'AnalysisDocumentBounds\..*' 'AnalysisGraphRunState\..*' 'AnalysisGraphRunEditorPython\..*' 'ProjectAnalysesPython\..*' 'ReportsEditorPython\..*' 'ProjectAnalysisRunsPython\..*' 'Rows/ProjectAnalysesUnreadable\..*' 'Replies/ProjectAnalysesUncertain\..*' 'SimulationPython\..*' 'LammpsSimulationPython\..*' 'ScriptPython\..*' 'TableEditorPython\..*' 'ProjectFileTreePython\..*' 'ProjectDraftRecoveryPython\..*' 'WorkbenchModules(Clicks)?\..*' 'TableCellSelection\..*' 'TableGrid\..*' 'ContainerDrag\..*' 'ProjectPagingPython\..*' 'TableWorkbench(Python|EditorPython|Layout)\..*' 'TableObjectPreviewPython\..*' 'AppStoreOpenResult\..*' 'TableIOEditorPython\..*' 'TableIOWorkspaceState\..*' 'WorkspaceTransferPython\..*' 'WorkspacePagingPython\..*' 'ViewerWorkspace\..*' 'WorkspaceTree\..*' 'WorkspaceDesktop\..*' 'PosixEventThread\..*' 'JobsPython\..*' 'app_viewer_python_(vulkan|opengl)' \
            'ui_label_backdrop_(opengl|vulkan)' 'viewer_(vulkan|opengl)_NonFinite' 'app_viewer_e2e_(vulkan|opengl)' 'app_viewer_window_(xvfb|weston)' 'workspace_window_(xvfb|weston)' 'package_install_check'
          for server in xvfb weston; do
            for backend in opengl vulkan; do
              python3 desktop/tests/check_required_tests.py build/ctest-junit.xml "document_preview_${server}_${backend}"
            done
          done
          for backend in opengl vulkan; do
            for language in en zh; do
              for editor in project python expression project_manage project_files project_snapshots offline_workbench project_csv project_sweep project_recent project_runs project_review project_review_errors project_drafts project_discussion project_requests project_filter project_simulation project_batches project_simulation_lammps project_simulation_lammps_narrow project_batches_lammps project_batches_lammps_narrow project_pet_study project_pet_study_narrow project_ai project_ai_narrow project_ai_stream project_ai_proposal project_ai_proposal_narrow project_ai_scope project_ai_scope_narrow project_ai_focus project_workspace project_workspace_narrow project_skills project_skills_narrow analysis_graph_wide analysis_graph_narrow analysis_graph_saved_wide analysis_graph_saved_narrow analysis_runs_prepare_wide analysis_runs_prepare_narrow analysis_runs_result_wide analysis_runs_result_narrow analysis_parameters_wide analysis_parameters_narrow analysis_links_wide analysis_links_narrow analysis_graph_edit_wide analysis_graph_edit_narrow workflow_wide workflow_narrow enter_wide enter_narrow workflow_edit_wide workflow_edit_narrow workflow_run_wide workflow_run_narrow analysis_outputs_wide analysis_outputs_narrow analysis_input_reuse_wide analysis_input_reuse_narrow analysis_result_inspection_values_wide analysis_result_inspection_values_narrow analysis_result_inspection_issues_wide analysis_result_inspection_issues_narrow analysis_table_grid_wide analysis_table_grid_narrow analysis_graph_run_wide analysis_graph_run_narrow scalar_volume_wide scalar_volume_narrow workbench_modules_nodes_wide workbench_modules_nodes_narrow workbench_modules_python_wide workbench_modules_python_narrow workbench_modules_table_wide workbench_modules_table_narrow workbench_modules_table_focus workbench_modules_table_board workbench_modules_table_gallery table_io_xlsx_wide table_io_xlsx_narrow table_io_json_wide table_io_json_narrow workspace_export_wide workspace_export_narrow workspace_import_wide workspace_import_narrow reports_text_wide reports_text_narrow reports_png_wide reports_png_narrow reports_create_wide reports_create_narrow reports_sources_wide reports_sources_narrow reports_document_wide reports_document_narrow; do
                python3 desktop/tests/check_required_tests.py build/ctest-junit.xml "${editor}_render_${backend}_${language}"
              done
            done
          done

      - name: Upload rendered frames and e2e images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-frames
          path: |
            build/tests/wm/out/*.png
            build/tests/app/out/*.png
            build/tests/viewer/out/*.png
            build/tests/app/e2e_*/out.png
            build/tests/app/e2e_*/seq/*.png
            build/packaging/check/*.png
            build/spike/*.png
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
            build/tests/wm/d_*/server.log
            build/spike/document_preview/d_*/server.log
          if-no-files-found: ignore
          retention-days: 14

  linux-package:
    name: Linux package (Ubuntu 24.04, relocatable tarball)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # ubuntu:24.04, pinned by digest (multi-arch index): the package runs on glibc >= 2.39.
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils g++ cmake ninja-build python3 file \
            libx11-dev libxi-dev libxfixes-dev libxrender-dev libxxf86vm-dev libxext-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin libdecor-0-dev libdbus-1-dev \
            libepoxy-dev libegl-dev libgl-dev libgles-dev libglx-dev libopengl-dev \
            libfreetype-dev libbrotli-dev libpng-dev zlib1g-dev libzstd-dev libeigen3-dev libfmt-dev \
            libvulkan-dev libshaderc-dev glslang-dev spirv-headers

      - name: Newer Vulkan headers and Wayland protocol XML (build-time only)
        # Ubuntu 24.04 has Vulkan headers 1.3.275 and wayland-protocols 1.34; Blender 5.2's GHOST and
        # GPU module need VK_KHR_dynamic_rendering_local_read / line rasterization (1.4 headers) and
        # the color-management and xdg-toplevel-icon protocols. Both are headers / XML: the binaries
        # still use 24.04's libvulkan loader and libwayland. The versions match Ubuntu 26.04 (the
        # development sysroot); pinned by sha256.
        run: |
          set -euo pipefail
          cd /opt
          curl -fsSL -o vh.tar.gz https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.341.tar.gz
          echo "8876aad926b2e72bdefddc34885472d5332e2d20aa3ed57313466f0bc982cf3f  vh.tar.gz" | sha256sum -c
          curl -fsSL -o wp.tar.xz https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.47/downloads/wayland-protocols-1.47.tar.xz
          echo "5fd4349bcbc9bab9a46f8cf77d1f434296a7a052c87440a094f63fcf62a58e20  wp.tar.xz" | sha256sum -c
          tar xzf vh.tar.gz
          tar xJf wp.tar.xz
          test -f /opt/Vulkan-Headers-1.4.341/include/vulkan/vulkan_core.h
          test -f /opt/wayland-protocols-1.47/stable/xdg-shell/xdg-shell.xml

      - name: Configure (Release, relocatable, bundle non-system libraries)
        run: |
          cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTK_SYSROOT=/nonexistent \
            -DVulkan_INCLUDE_DIR=/opt/Vulkan-Headers-1.4.341/include -DWAYLAND_PROTOCOLS_DIR=/opt/wayland-protocols-1.47 \
            -DSTK_DESKTOP_RELOCATABLE=ON -DSTK_DESKTOP_BUNDLE_LIBS=ON

      - name: Build stk-desktop and stk-render
        run: cmake --build build --parallel --target stk-desktop stk-render -- -k 0

      - name: Package (CPack TGZ)
        run: |
          set -euo pipefail
          cd build
          cpack --config CPackConfig.cmake
          sha256sum stk-desktop-*.tar.gz | tee "$(ls stk-desktop-*.tar.gz).sha256"
          tar tzvf stk-desktop-*.tar.gz | grep -E '/(bin|lib/stk-desktop)/'
          f=$(ls stk-desktop-*.tar.gz); echo "size: $(du -h "$f" | cut -f1) $f"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-package
          path: |
            build/stk-desktop-*.tar.gz
            build/stk-desktop-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  linux-package-smoke:
    name: Linux package smoke (fresh Ubuntu 24.04)
    needs: linux-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
      options: --init
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the runtime libraries of a desktop (no development packages)
        # No libshaderc1 / libepoxy0: the tarball must bring them.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates python3 python3-venv \
            libgl1 libegl1 libglx-mesa0 libegl-mesa0 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            libfreetype6 libpng16-16t64 libzstd1 libx11-6 libxi6 libxfixes3 libxext6 libxrender1 libxxf86vm1 \
            libxcursor1 libxkbcommon0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libdbus-1-3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: desktop-linux-package
          path: pkg

      - name: Python with STK installed (pip install of the repository; the tarball has no Python)
        run: |
          set -euo pipefail
          python3 -m venv /opt/stk-venv
          /opt/stk-venv/bin/python -m pip install ".[science,visualization,control,documents]"

      - name: Unpack into a fresh directory
        run: |
          set -euo pipefail
          (cd pkg && sha256sum -c ./*.sha256)
          mkdir -p /tmp/fresh
          tar xzf pkg/stk-desktop-*.tar.gz -C /tmp/fresh
          ls /tmp/fresh/*/bin /tmp/fresh/*/lib/stk-desktop

      - name: Smoke (OpenGL on llvmpipe; e2e preset command against the golden)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          /opt/stk-venv/bin/python desktop/packaging/check_install.py --prefix /tmp/fresh/stk-desktop-* \
            --workdir /tmp/smoke-opengl --backend opengl --payload docs/specs/examples/payload-v2 \
            --python /opt/stk-venv/bin/python --repo "$PWD" --golden desktop/tests/app/golden/e2e_muferro_domains.png

      - name: Smoke (Vulkan on lavapipe)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          /opt/stk-venv/bin/python desktop/packaging/check_install.py --prefix /tmp/fresh/stk-desktop-* \
            --workdir /tmp/smoke-vulkan --backend vulkan --payload docs/specs/examples/payload-v2 \
            --python /opt/stk-venv/bin/python --repo "$PWD" --golden desktop/tests/app/golden/e2e_muferro_domains.png

      - name: Upload smoke images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-package-smoke
          path: |
            /tmp/smoke-*/*.png
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS arm64 (Cocoa + Metal)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/.vcpkg-triplets
      # FreeType must decode WOFF2 (brotli): Homebrew's freetype is built without it, vcpkg's is not.
      VCPKG_PACKAGES: freetype[core,brotli,zlib] fmt eigen3 zstd zlib
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16
        # Blender 5.2 requires Xcode >= 16; pin the newest Xcode 16 on the image.
        run: |
          set -euo pipefail
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          clang++ --version

      - name: vcpkg triplet (deployment target 13.3) and cache key
        id: vcpkg-key
        # The stock arm64-osx triplet builds for the runner's macOS; pin the dependencies to the
        # engine's deployment target (desktop/CMakeLists.txt). The triplet is part of vcpkg's ABI
        # hash, so cached binaries built for another target are not reused.
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_OVERLAY_TRIPLETS"
          cp "$VCPKG_INSTALLATION_ROOT/triplets/arm64-osx.cmake" "$VCPKG_OVERLAY_TRIPLETS/"
          echo 'set(VCPKG_OSX_DEPLOYMENT_TARGET 13.3)' >> "$VCPKG_OVERLAY_TRIPLETS/arm64-osx.cmake"
          echo "commit=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-${{ steps.vcpkg-key.outputs.commit }}-${{ hashFiles('.github/workflows/desktop.yml') }}
          restore-keys: vcpkg-arm64-osx-${{ steps.vcpkg-key.outputs.commit }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          brew install ninja
          # shellcheck disable=SC2086
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet arm64-osx $VCPKG_PACKAGES

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Python for the bridge tests (science, visualization and control extras)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/stk-venv"
          "$RUNNER_TEMP/stk-venv/bin/python" -m pip install ".[science,visualization,control,documents,test]"
          PYTHONPATH="$PWD/desktop/tests/bridge" "$RUNNER_TEMP/stk-venv/bin/python" desktop/tests/bridge/bridge_fixture.py check graph
          echo "STK_VENV=$RUNNER_TEMP/stk-venv" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S desktop -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSTK_DESKTOP_ENABLE_NATIVE_DOCUMENT_PREVIEW=ON \
            -DSTK_DESKTOP_BUILD_DOCUMENT_PREVIEW_SPIKE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DSTK_BRIDGE_TEST_PYTHON="$STK_VENV/bin/python" -DSTK_APP_TEST_PYTHON="$STK_VENV/bin/python"

      - name: Build
        id: macos-build
        run: cmake --build build --parallel

      - name: Test (CPU unit tests, CLI, leak self-test, UI core, bridge)
        run: ctest --test-dir build --output-on-failure -L "unit|wm|ui|bridge|project" -LE "gpu|window" --output-junit "$PWD/build/ctest-cpu.xml"

      - name: Test on Metal (headless goldens, viewer, e2e, install layout)
        # macos-15 runners expose the "Apple Paravirtual device" (argument buffers tier 2,
        # barycentrics, MTLGPUFamilyMac2); macos-14 runners have no Metal device at all.
        # Metal compiles shaders with fast math, so stk_viewer_gpu never relies on NaN/Inf in a
        # shader (viewer_metal_Lut / viewer_metal_NonFinite check the NaN colour).
        run: ctest --test-dir build --output-on-failure -L gpu -LE window --output-junit "$PWD/build/ctest-metal.xml"

      - name: The Python-backed tests ran (the Runtime ones are Linux-only)
        if: success() || failure()
        run: |
          python3 desktop/tests/check_required_tests.py build/ctest-cpu.xml \
            'native_evidence_gate' 'ReportDocumentHost\..*' 'NativeViewport\..*' 'NativeViewInvalidation\..*' 'AreaRemoval\..*' 'ProjectScopeNotifications\..*' 'document_preview_memory_.*' 'Schema\.ReportsSourceReviewAndOptionalCompareAndSwap' 'Schema\.ReportsPreviewResources' 'DocumentResources\..*' 'DocumentEvidence\..*' 'ReportsPreviewPython\..*' 'ReportGenerationPython\..*' 'LanguagesAndWidths/ReportGenerationMouse\..*' 'Receipts/ReportsPreviewInvalid\..*' 'Generation/ReportsGeneratedInvalid\..*' 'Receipts/ReportsPdfInvalid\..*' 'Scopes/ReportsPdfInvalidation\..*' 'LayoutObserver(Test|Lifetime)\..*' \
            'PythonBridge\.(HelloListsTheProtocol|ColormapsList|GraphPresets|LocalGraphEvaluateOnAFakeMuferroRun|ManagedSSHProfileRoundTripDoesNotConnectImplicitly)' 'ProjectPython\..*' 'LammpsProjectPython\..*' 'ProjectStream\..*' 'ProjectLegacyStream\..*' 'ProjectProposal\..*' 'AgentPython\..*' 'ModulesPython\..*' 'SavedReviewPython\..*' 'ProjectScope\..*' 'ProjectContextSelection\..*' 'FocusNavigation\..*' 'WorkModeLayouts\..*' 'LanguagesAndScale/WorkModeLayoutClicks\..*' 'TreeFixture\.Arrangement.*' 'WorkspaceNavigation(Python)?\..*' 'SkillCatalog\..*' 'SkillsCatalogPython\..*' 'ProjectSkillsPython\..*' 'AnalysisGraphView\..*' 'AnalysisGraphCanvas\..*' 'ViewerGraphInspection(Test)?\..*' 'AnalysisGraphState\..*' 'AnalysisGraphPython\..*' 'AnalysisGraphCatalogPython\..*' 'Configuration/AnalysisGraphStale\..*' 'AnalysisGraphEditor(Test|Python)\..*' 'Camera\..*' 'LabelBackdrop\..*' 'ScalarVolumePython\..*' 'VolumeFloatTexture\..*' 'FormSchema\.(JsonDeclarationsKeepTypedDefaultsAfterReferenceSpecialization|NullabilityIntersectsDeclarationAndEveryReferenceInEitherOrder)' 'FormBuilder\.ScalarVolumeNullableUnitAndStrictFieldRoundTrip' 'ViewerGraphConfiguration(Test|Python)\..*' 'AnalysisDocumentsEditor\..*' 'AnalysisParameterDraft\..*' 'AnalysisOutputDraft\..*' 'AnalysisInputReuse\..*' 'AnalysisResultInspection\..*' 'AnalysisResultInspectionEditorPython\..*' 'AnalysisTableGrid\..*' 'AnalysisTableGridEditorPython\..*' 'Json\..*' 'Region\..*' 'AnalysisInputReuseEditorPython\..*' 'AnalysisOutputsEditorPython\..*' 'AnalysisParametersEditorPython\..*' 'AnalysisLinkDraft\..*' 'AnalysisCandidateValidation\..*' 'AnalysisLinksEditorPython\..*' 'WorkflowView\..*' 'WorkflowDraft\..*' 'WorkflowEditorPython\..*' 'ProjectFiles\..*' 'AnalysisDocumentBounds\..*' 'AnalysisGraphRunState\..*' 'AnalysisGraphRunEditorPython\..*' 'ProjectAnalysesPython\..*' 'ReportsEditorPython\..*' 'ProjectAnalysisRunsPython\..*' 'Rows/ProjectAnalysesUnreadable\..*' 'Replies/ProjectAnalysesUncertain\..*' 'ScriptPython\..*' 'TableEditorPython\..*' 'ProjectFileTreePython\..*' 'ProjectDraftRecoveryPython\..*' 'WorkbenchModules(Clicks)?\..*' 'TableCellSelection\..*' 'TableGrid\..*' 'ContainerDrag\..*' 'ProjectPagingPython\..*' 'TableWorkbench(Python|EditorPython|Layout)\..*' 'TableObjectPreviewPython\..*' 'AppStoreOpenResult\..*' 'TableIOEditorPython\..*' 'TableIOWorkspaceState\..*' 'WorkspaceTransferPython\..*' 'WorkspacePagingPython\..*' 'ViewerWorkspace\..*' 'WorkspaceTree\..*' 'WorkspaceDesktop\..*' 'PosixEventThread\..*'
          python3 desktop/tests/check_required_tests.py build/ctest-metal.xml \
            'ui_label_backdrop_metal' 'viewer_metal_NonFinite' 'app_viewer_python_metal' 'app_viewer_e2e_metal' 'package_install_check'
          for language in en zh; do
            for editor in project python expression project_manage project_files project_snapshots offline_workbench project_csv project_sweep project_recent project_runs project_review project_review_errors project_drafts project_discussion project_requests project_filter project_simulation project_batches project_simulation_lammps project_simulation_lammps_narrow project_batches_lammps project_batches_lammps_narrow project_pet_study project_pet_study_narrow project_ai project_ai_narrow project_ai_stream project_ai_proposal project_ai_proposal_narrow project_ai_scope project_ai_scope_narrow project_ai_focus project_workspace project_workspace_narrow project_skills project_skills_narrow analysis_graph_wide analysis_graph_narrow analysis_graph_saved_wide analysis_graph_saved_narrow analysis_runs_prepare_wide analysis_runs_prepare_narrow analysis_runs_result_wide analysis_runs_result_narrow analysis_parameters_wide analysis_parameters_narrow analysis_links_wide analysis_links_narrow analysis_graph_edit_wide analysis_graph_edit_narrow workflow_wide workflow_narrow enter_wide enter_narrow workflow_edit_wide workflow_edit_narrow workflow_run_wide workflow_run_narrow analysis_outputs_wide analysis_outputs_narrow analysis_input_reuse_wide analysis_input_reuse_narrow analysis_result_inspection_values_wide analysis_result_inspection_values_narrow analysis_result_inspection_issues_wide analysis_result_inspection_issues_narrow analysis_table_grid_wide analysis_table_grid_narrow analysis_graph_run_wide analysis_graph_run_narrow scalar_volume_wide scalar_volume_narrow workbench_modules_nodes_wide workbench_modules_nodes_narrow workbench_modules_python_wide workbench_modules_python_narrow workbench_modules_table_wide workbench_modules_table_narrow workbench_modules_table_focus workbench_modules_table_board workbench_modules_table_gallery table_io_xlsx_wide table_io_xlsx_narrow table_io_json_wide table_io_json_narrow workspace_export_wide workspace_export_narrow workspace_import_wide workspace_import_narrow reports_text_wide reports_text_narrow reports_png_wide reports_png_narrow reports_create_wide reports_create_narrow reports_sources_wide reports_sources_narrow reports_document_wide reports_document_narrow; do
              python3 desktop/tests/check_required_tests.py build/ctest-metal.xml "${editor}_render_metal_${language}"
            done
          done

      - name: stk-render smoke (Metal, spec example payload)
        run: build/bin/stk-render --payload docs/specs/examples/payload-v2 --export build/stk-render-metal.png

      - name: STK.app (relocatable, unsigned; ad-hoc code signature), zipped
        run: |
          set -euo pipefail
          # Drop the source-tree fallbacks: only the executables that embed them are rebuilt.
          cmake -S desktop -B build -DSTK_DESKTOP_RELOCATABLE=ON
          cmake --build build --parallel --target stk-desktop stk-render
          rm -rf build/stage
          cmake --install build --prefix build/stage --strip
          codesign --force --sign - build/stage/STK.app/Contents/MacOS/stk-render
          codesign --force --sign - build/stage/STK.app
          codesign --verify --strict --verbose=2 build/stage/STK.app
          plutil -lint build/stage/STK.app/Contents/Info.plist
          # Only system libraries and frameworks (the vcpkg dependencies are static).
          for exe in build/stage/STK.app/Contents/MacOS/*; do
            otool -L "$exe"
            if otool -L "$exe" | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
              echo "::error::$exe links a non-system library"; exit 1
            fi
          done
          version=$(sed -n 's/^project(stk_desktop VERSION \([0-9.]*\).*/\1/p' desktop/CMakeLists.txt)
          ditto -c -k --keepParent build/stage/STK.app "build/stk-desktop-$version-macos-arm64.zip"
          shasum -a 256 build/stk-desktop-*-macos-arm64.zip | tee "build/stk-desktop-$version-macos-arm64.zip.sha256"
          du -h build/stk-desktop-*-macos-arm64.zip

      - name: STK.app smoke (unzipped into a fresh directory, headless on Metal, e2e preset command)
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/fresh-app"
          rm -rf "$fresh" && mkdir -p "$fresh"
          ditto -x -k build/stk-desktop-*-macos-arm64.zip "$fresh"
          "$STK_VENV/bin/python" desktop/packaging/check_install.py --prefix "$fresh" --workdir "$RUNNER_TEMP/smoke-metal" \
            --backend metal --payload docs/specs/examples/payload-v2 \
            --python "$STK_VENV/bin/python" --repo "$PWD" --golden desktop/tests/app/golden/e2e_muferro_domains.png
          cp "$RUNNER_TEMP"/smoke-metal/*.png build/stage/ 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-app
          path: |
            build/stk-desktop-*-macos-arm64.zip
            build/stk-desktop-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Native WKWebView and production ReportsEditor (OS screenshot evidence)
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        # Requires the runner's real window server, Metal and ScreenCaptureKit permission.
        # Missing capability fails; there is no Unsupported/skip fallback or TCC modification.
        run: |
          ctest --test-dir build --output-on-failure -R '^(document_preview_native_metal|reports_native_(markdown|html|pdf)_metal)$' --timeout 600 --output-junit "$PWD/build/ctest-native-preview.xml"
          python3 desktop/tests/check_required_tests.py build/ctest-native-preview.xml 'document_preview_native_metal' 'reports_native_markdown_metal' 'reports_native_html_metal' 'reports_native_pdf_metal'

      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-frames
          path: |
            build/tests/wm/out/*.png
            build/tests/app/out/*.png
            build/tests/viewer/out/*.png
            build/tests/app/e2e_*/out.png
            build/stage/*.png
            build/stk-render-metal.png
            build/ctest-cpu.xml
            build/ctest-metal.xml
            build/ctest-native-preview.xml
            build/spike/document_preview/native-evidence/**
            build/tests/app/reports-native-markdown/**
            build/tests/app/reports-native-html/**
            build/tests/app/reports-native-pdf/**
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows (MSVC, CPU tests)
    outputs:
      native_bundle: ${{ steps.native-bundle.outputs.ready }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      VCPKG_PACKAGES: libepoxy freetype[core,brotli,zlib] fmt eigen3 zstd zlib pthreads
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check Windows quick setup prerequisites and wrapper
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/setup-windows.ps1 --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: vcpkg cache key
        id: vcpkg-key
        run: |
          $commit = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Python for local project bridge tests
        run: |
          python -m venv .venv-bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.venv-bridge/Scripts/python.exe -m pip install ".[science,visualization,documents]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path $PWD 'desktop/tests/bridge'
          & ./.venv-bridge/Scripts/python.exe desktop/tests/bridge/bridge_fixture.py check graph
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-${{ steps.vcpkg-key.outputs.commit }}-${{ hashFiles('.github/workflows/desktop.yml') }}
          restore-keys: vcpkg-x64-windows-${{ steps.vcpkg-key.outputs.commit }}-

      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows $env:VCPKG_PACKAGES.Split(' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        # Vulkan is off: it needs the LunarG SDK (shaderc); OpenGL + Win32 GHOST are built.
        run: |
          $bridgePython = Join-Path $PWD '.venv-bridge/Scripts/python.exe'
          cmake -S desktop -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DSTK_GPU_VULKAN=OFF `
            -DSTK_DESKTOP_ENABLE_NATIVE_DOCUMENT_PREVIEW=ON `
            -DSTK_DESKTOP_BUILD_DOCUMENT_PREVIEW_SPIKE=ON `
            -DSTK_BRIDGE_TEST_PYTHON="$bridgePython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (every target)
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage native preview candidate for its independent validation job
        id: native-bundle
        run: |
          $bundle = Join-Path $PWD 'build/native-preview-bundle'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          $exe = Join-Path $PWD 'build/bin/Release/stk-document-preview-spike.exe'
          if (-not (Test-Path $exe)) { throw 'Native preview executable was not built' }
          Copy-Item $exe $bundle
          $reports = Join-Path $PWD 'build/bin/Release/stk-reports-native-window.exe'
          if (-not (Test-Path $reports)) { throw 'Production report validation executable was not built' }
          Copy-Item $reports $bundle
          Copy-Item 'desktop/tests/check_native_evidence.py' $bundle
          # vcpkg's app-local deployment puts linked runtime DLLs beside each executable.
          Get-ChildItem (Split-Path $exe) -Filter '*.dll' | Copy-Item -Destination $bundle
          Copy-Item 'build/bin/datafiles' $bundle -Recurse
          Copy-Item 'build/bin/i18n' $bundle -Recurse
          Copy-Item 'docs/specs/examples/payload-v2' (Join-Path $bundle 'document-preview-payload') -Recurse
          @'
          add_test(document_preview_native_opengl "$ENV{STK_REPORTS_TEST_PYTHON}" "$ENV{STK_NATIVE_TEST_DIR}/check_native_evidence.py" --success-marker "PASS: native document evidence" --timeout 570 -- "$ENV{STK_NATIVE_TEST_DIR}/stk-document-preview-spike.exe" --smoke --require-native --cycles 20 --evidence-dir "$ENV{STK_NATIVE_TEST_DIR}/evidence" --gpu-backend opengl)
          set_tests_properties(document_preview_native_opengl PROPERTIES TIMEOUT 600 ENVIRONMENT "STK_TOKEN_PLAN_API_KEY=" ENVIRONMENT_MODIFICATION "STK_TOKEN_PLAN_MODEL=unset:" FAIL_REGULAR_EXPRESSION "FAIL:|leaked|Error: Not freed memory")
          foreach(source markdown html pdf)
            add_test(reports_native_${source}_opengl "$ENV{STK_REPORTS_TEST_PYTHON}" "$ENV{STK_NATIVE_TEST_DIR}/check_native_evidence.py" --success-marker "PASS: production ReportsEditor native evidence" --timeout 570 -- "$ENV{STK_NATIVE_TEST_DIR}/stk-reports-native-window.exe" --python "$ENV{STK_REPORTS_TEST_PYTHON}" --source "${source}" --evidence-dir "$ENV{STK_NATIVE_TEST_DIR}/reports-${source}" --gpu-backend opengl)
            set_tests_properties(reports_native_${source}_opengl PROPERTIES TIMEOUT 600 ENVIRONMENT "STK_TOKEN_PLAN_API_KEY=" ENVIRONMENT_MODIFICATION "STK_TOKEN_PLAN_MODEL=unset:" FAIL_REGULAR_EXPRESSION "FAIL:|leaked|Error: Not freed memory")
          endforeach()
          '@ | Set-Content -Encoding utf8 (Join-Path $bundle 'CTestTestfile.cmake')
          'ready=true' >> $env:GITHUB_OUTPUT

      - name: Upload native preview candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-windows-native-candidate
          path: build/native-preview-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Test (CPU unit tests, CLI, UI core, bridge)
        run: |
          $junitPath = Join-Path $PWD 'build/ctest-cpu.xml'
          ctest --test-dir build -C Release --output-on-failure -L "unit|wm|ui|bridge|project" -LE "gpu|window" --timeout 600 --output-junit "$junitPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Local project tests ran with the real Python bridge
        run: |
          python desktop/tests/check_required_tests.py build/ctest-cpu.xml 'native_evidence_gate' 'ReportDocumentHost\..*' 'NativeViewport\..*' 'NativeViewInvalidation\..*' 'AreaRemoval\..*' 'ProjectScopeNotifications\..*' 'document_preview_memory_.*' 'Schema\.ReportsSourceReviewAndOptionalCompareAndSwap' 'Schema\.ReportsPreviewResources' 'DocumentResources\..*' 'DocumentEvidence\..*' 'ReportsPreviewPython\..*' 'ReportGenerationPython\..*' 'LanguagesAndWidths/ReportGenerationMouse\..*' 'Receipts/ReportsPreviewInvalid\..*' 'Generation/ReportsGeneratedInvalid\..*' 'Receipts/ReportsPdfInvalid\..*' 'Scopes/ReportsPdfInvalidation\..*' 'LayoutObserver(Test|Lifetime)\..*' 'ProjectPython\..*' 'LammpsProjectPython\..*' 'ProjectStream\..*' 'ProjectLegacyStream\..*' 'ProjectProposal\..*' 'AgentPython\..*' 'SavedReviewPython\..*' 'ProjectScope\..*' 'ProjectContextSelection\..*' 'FocusNavigation\..*' 'WorkModeLayouts\..*' 'LanguagesAndScale/WorkModeLayoutClicks\..*' 'TreeFixture\.Arrangement.*' 'WorkspaceNavigation(Python)?\..*' 'SkillCatalog\..*' 'SkillsCatalogPython\..*' 'ProjectSkillsPython\..*' 'AnalysisGraphView\..*' 'AnalysisGraphCanvas\..*' 'ViewerGraphInspection(Test)?\..*' 'AnalysisGraphState\..*' 'AnalysisGraphPython\..*' 'AnalysisGraphCatalogPython\..*' 'Configuration/AnalysisGraphStale\..*' 'AnalysisGraphEditor(Test|Python)\..*' 'Camera\..*' 'LabelBackdrop\..*' 'ScalarVolumePython\..*' 'VolumeFloatTexture\..*' 'FormSchema\.(JsonDeclarationsKeepTypedDefaultsAfterReferenceSpecialization|NullabilityIntersectsDeclarationAndEveryReferenceInEitherOrder)' 'FormBuilder\.ScalarVolumeNullableUnitAndStrictFieldRoundTrip' 'ViewerGraphConfiguration(Test|Python)\..*' 'AnalysisDocumentsEditor\..*' 'AnalysisParameterDraft\..*' 'AnalysisOutputDraft\..*' 'AnalysisInputReuse\..*' 'AnalysisResultInspection\..*' 'AnalysisResultInspectionEditorPython\..*' 'AnalysisTableGrid\..*' 'AnalysisTableGridEditorPython\..*' 'Json\..*' 'Region\..*' 'AnalysisInputReuseEditorPython\..*' 'AnalysisOutputsEditorPython\..*' 'AnalysisParametersEditorPython\..*' 'AnalysisLinkDraft\..*' 'AnalysisCandidateValidation\..*' 'AnalysisLinksEditorPython\..*' 'WorkflowView\..*' 'WorkflowDraft\..*' 'WorkflowEditorPython\..*' 'ProjectFiles\..*' 'AnalysisDocumentBounds\..*' 'AnalysisGraphRunState\..*' 'AnalysisGraphRunEditorPython\..*' 'ProjectAnalysesPython\..*' 'ReportsEditorPython\..*' 'ProjectAnalysisRunsPython\..*' 'Rows/ProjectAnalysesUnreadable\..*' 'Replies/ProjectAnalysesUncertain\..*' 'ScriptPython\..*' 'TableEditorPython\..*' 'ProjectFileTreePython\..*' 'ProjectDraftRecoveryPython\..*' 'WorkbenchModules(Clicks)?\..*' 'TableCellSelection\..*' 'TableGrid\..*' 'ContainerDrag\..*' 'ProjectPagingPython\..*' 'TableWorkbench(Python|EditorPython|Layout)\..*' 'TableObjectPreviewPython\..*' 'AppStoreOpenResult\..*' 'TableIOEditorPython\..*' 'TableIOWorkspaceState\..*' 'WorkspaceTransferPython\..*' 'WorkspacePagingPython\..*' 'ViewerWorkspace\..*' 'WorkspaceTree\..*' 'WorkspaceDesktop\..*' 'PythonBridge\.ManagedSSHProfileRoundTripDoesNotConnectImplicitly'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows CPU test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-windows-cpu-results
          path: |
            build/ctest-cpu.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  windows-native-preview:
    name: Windows native document composition (llvmpipe/WARP, 20 cycles, OS evidence)
    needs: windows
    if: ${{ always() && !cancelled() && needs.windows.outputs.native_bundle == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: desktop-windows-native-candidate
          path: native-preview

      - name: Record native display capability context
        run: |
          New-Item -ItemType Directory -Force 'native-preview/evidence' | Out-Null
          # Hardware/session metadata only; no registry profiles, process command lines or screen reads.
          $context = [ordered]@{
            os_version = [Environment]::OSVersion.Version.ToString()
            interactive = [Environment]::UserInteractive
            process_session = [Diagnostics.Process]::GetCurrentProcess().SessionId
            display_drivers = @(Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, Status)
            note = 'Actual GL 4.3/WGC/Runtime checks follow. No driver or WebView2 Runtime is installed here.'
          }
          $context | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'native-preview/evidence/environment.json'

      - name: Stage pinned process-local Mesa for software OpenGL acceptance
        # Test executables only: no system driver, registry, DXGI or D3D replacement.
        # This is pal1000's Mesa distribution, not an official Mesa binary release.
        run: |
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'stk-native-mesa-26.2.4'
          $mesaUrl = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $mesaSha = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          & curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 180 --output $mesaArchive $mesaUrl
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Mesa archive download failed' }
          if ((Get-Item $mesaArchive).Length -ne 70257286 -or (Get-FileHash $mesaArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mesaSha) {
            throw 'Pinned Mesa archive size or SHA-256 mismatch'
          }
          $sevenZip = (Get-Command '7z.exe' -ErrorAction Stop).Source
          & $sevenZip l -slt $mesaArchive | Set-Content -Encoding utf8 'native-preview/evidence/mesa-archive-list.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect pinned Mesa archive' }
          & $sevenZip x -y "-o$mesaRoot" $mesaArchive 'x64/opengl32.dll' 'x64/libgallium_wgl.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract the two process-local x64 Mesa DLLs' }
          $mesaFiles = @()
          foreach ($name in 'opengl32.dll', 'libgallium_wgl.dll') {
            $source = Join-Path $mesaRoot "x64/$name"
            if (-not (Test-Path -PathType Leaf $source)) { throw "Missing expected x64 Mesa DLL: $name" }
            $destination = Join-Path $PWD "native-preview/$name"
            if (Test-Path $destination) { throw "Refusing to replace a staged runtime DLL: $name" }
            Copy-Item $source $destination
            $mesaFiles += [ordered]@{ name = $name; size = (Get-Item $destination).Length; sha256 = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [ordered]@{
            source = $mesaUrl; archive_sha256 = $mesaSha; archive_size = 70257286
            files = $mesaFiles; requested_gl_renderer = 'llvmpipe'; requested_capture_driver = 'warp'
            note = 'Process-local functional acceptance; actual GL renderer and WGC adapter are recorded by the tests. No GL version override, hardware performance or browser memory claim.'
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'native-preview/evidence/mesa.json'

      - name: Python for the production report fixture
        run: |
          python -m venv .venv-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $PWD '.venv-native/Scripts/python.exe'
          & $python -m pip install '.[science,visualization,documents]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "STK_REPORTS_TEST_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Native WebView2 and production ReportsEditor (OS screenshot evidence)
        env:
          GALLIUM_DRIVER: llvmpipe
          STK_NATIVE_EVIDENCE_REQUIRE_LLVMPIPE: "1"
          STK_NATIVE_EVIDENCE_D3D_DRIVER: warp
          STK_NATIVE_TEST_DIR: ${{ github.workspace }}/native-preview
        # The prototype probes GL 4.3 before GHOST can open a modal unsupported-driver dialog.
        # WARP capture is explicit; absent interactive display, WGC or Runtime still FAILS.
        run: |
          $junitPath = Join-Path $PWD 'native-preview/ctest-native-preview.xml'
          ctest --test-dir native-preview --output-on-failure -R '^(document_preview_native_opengl|reports_native_(markdown|html|pdf)_opengl)$' --timeout 600 --output-junit "$junitPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/check_required_tests.py native-preview/ctest-native-preview.xml 'document_preview_native_opengl' 'reports_native_markdown_opengl' 'reports_native_html_opengl' 'reports_native_pdf_opengl'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native preview evidence and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-windows-native-preview
          path: |
            native-preview/ctest-native-preview.xml
            native-preview/evidence/**
            native-preview/reports-markdown/**
            native-preview/reports-html/**
            native-preview/reports-pdf/**
            native-preview/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
