name: Deploy to Cloudflare Pages
on:
  push:
    paths:
      - "docs/**"
      - .github/workflows/publish_docs.yml
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/.node-version

      - name: Install the pinned package manager
        run: npm install --global pnpm@8.15.9

      - name: Build
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm run build
          # Starlight 0.11 does not propagate a failed Pagefind subprocess exit.
          test -s dist/pagefind/pagefind.js

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd docs
          pnpm run deploy
