name: Build and Release App
on:
  push:
    tags:
      - 'v*'

jobs:
  ubuntu_build:
    if: false  # Temporarily disabled
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      # 添加Poetry缓存
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # 使用Poetry安装依赖
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
          python suan/scripts/run_write_version.py

      - name: Build executable
        run: |
          cd suan/gui
          python build_with_poetry.py
          cd dist
          ls -la

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          name: stk_ubuntu
          path: suan/gui/dist/stk_ubuntu

  macOS_build:
    if: false  # Temporarily disabled
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: Get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      # 添加Poetry缓存
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/Library/Caches/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # 使用Poetry安装依赖
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
          python suan/scripts/run_write_version.py

      - name: Build executable
        run: |
          cd suan/gui
          python build_with_poetry.py
          cd dist
          ls -la

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          name: stk_macos
          path: suan/gui/dist/stk_macos

  windows_build:
    runs-on: [ self-hosted, Windows ]

    steps:
      - uses: actions/checkout@v3
      
      - name: Check Python Version
        run: |
          python --version
          echo "Using system Python to avoid permission issues"

      # 添加缓存机制
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\.cache\pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Get tag
        id: get_tag
        run: |
          # 修正Windows环境下的环境变量设置方式
          echo "TAG=$($env:GITHUB_REF -replace 'refs/tags/v','')" >> $env:GITHUB_ENV

      - name: Setup environment
        run: |
          # 检查缓存的虚拟环境是否存在
          if (Test-Path .venv\Scripts\activate.ps1) {
            echo "Using cached virtual environment"
          } else {
            echo "Creating new virtual environment"
            python -m venv .venv
          }
          
          # 激活虚拟环境
          .\.venv\Scripts\activate.ps1
          
          # 更新pip并设置超时时间
          python -m pip install --upgrade pip --timeout 1800

      - name: Install Poetry
        run: |
          # 安装Poetry
          .\.venv\Scripts\activate.ps1
          python -m pip install poetry==1.7.1 --timeout 1800
          
          # 设置Poetry配置
          $env:POETRY_HTTP_TIMEOUT = 1800
          poetry --version
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: |
          .\.venv\Scripts\activate.ps1
          poetry install --no-interaction --no-root
          
          # 尝试手动安装关键依赖，以防Poetry安装失败
          if ($LASTEXITCODE -ne 0) {
            echo "Poetry install failed, falling back to pip"
            python -m pip install -r requirements.txt --timeout 1800
            python -m pip install pyinstaller==6.3.0 PySide6 vtk matplotlib pandas numpy requests toml --timeout 1800
          }

      - name: Generate version
        run: |
          .\.venv\Scripts\activate.ps1
          python suan\scripts\run_write_version.py

      - name: Build with Poetry
        run: |
          .\.venv\Scripts\activate.ps1
          cd suan\gui
          
          # 使用基于Poetry的构建脚本
          python build_with_poetry.py
          
          # 检查dist目录
          cd dist
          dir

      - name: Check build output
        run: |
          # 检查构建产物是否存在
          if (Test-Path suan\gui\dist\stk_windows.exe) {
            echo "Build artifact generated, size: $((Get-Item suan\gui\dist\stk_windows.exe).length / 1MB) MB"
          } else {
            echo "Build artifact not found, please check the build process"
            exit 1
          }

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          name: stk_windows
          path: suan/gui/dist/stk_windows.exe

  release:
    needs:
      - windows_build
      # - macOS_build    # Temporarily commented out
      # - ubuntu_build   # Temporarily commented out
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3
      - name: get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_OUTPUT"
          echo "The TAG is $steps.get_tag.outputs.TAG"

      - name: Create Release
        if: github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          release_name: ${{ steps.get_tag.outputs.TAG}}
          # body: |
          #   Release  ${{ steps.get_tag.outputs.TAG }}
          # draft: true
          # prerelease: false

      - name: Download ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_ubuntu
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download windows app
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_windows
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_macos
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/
      - run: |
          cd suan/gui/dist/
          ls

      - name: release ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_ubuntu
          asset_name: stk_ubuntu
          asset_content_type: application/octet-stream

      - name: release windows app
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_windows.exe
          asset_name: stk_windows.exe
          asset_content_type: application/octet-stream

      - name: release macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_macos
          asset_name: stk_macos
          asset_content_type: application/octet-stream

