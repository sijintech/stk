name: Build and Release App
on:
  push:
    tags:
      - 'v*'

jobs:
  ubuntu_build:
    if: false  # Temporarily disabled
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      # 添加Poetry缓存
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # 使用Poetry安装依赖
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
          python suan/scripts/run_write_version.py

      - name: Build executable
        run: |
          # 使用优化后的打包脚本
          cd suan/gui
          python build.py --clean

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          name: stk_ubuntu
          path: suan/gui/dist/stk_ubuntu

  macOS_build:
    if: false  # Temporarily disabled
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      - name: Setup virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
      - name: build exe
        run: |
          python -m pip install -U pip
          python suan/scripts/run_write_version.py
          cd suan/gui/
          pip install vtk==9.3.0
          pip install pyinstaller==6.3.0
          pip install pyinstaller-hooks-contrib  # 添加hooks贡献库
          pip install PySide6
          pip install matplotlib
          pip install pandas
          pip install numpy
          pip install requests
          pip install toml
          python build.py --clean  # 使用优化后的打包脚本
          cd dist
          ls

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          # 上传后的标记名，下载依靠它找到对应文件
          name: stk_macos
          # 上传的文件位置
          path: suan/gui/dist/stk_macos

  windows_build:
    runs-on: [ self-hosted, Windows ]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v3
      
      - name: Configure PowerShell encoding
        run: |
          # 配置PowerShell使用UTF-8编码
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          # 验证编码设置
          Write-Host "当前输出编码: $([Console]::OutputEncoding.WebName)"
          Write-Host "测试中文输出: 你好，世界！"
      
      - name: Check Python Version
        run: |
          python --version
          echo "Using system Python to avoid permission issues"

      # 添加缓存机制
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\.cache\pypoetry
            .venv
            ~\AppData\Python\Scripts
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: get tag
        id: get_tag
        run: |
          # 修正Windows环境下的环境变量设置方式
          echo "TAG=$($env:GITHUB_REF -replace 'refs/tags/v','')" >> $env:GITHUB_ENV

      - name: Install Poetry
        run: |
          # 检查Poetry是否已安装
          $poetryPath = "$env:APPDATA\Python\Scripts\poetry.exe"
          if (-not (Test-Path $poetryPath)) {
            Write-Host "Poetry not found at $poetryPath, installing..."
            # 如果未安装，则安装Poetry
            (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
            # 将Poetry添加到PATH
            echo "$env:APPDATA\Python\Scripts" >> $env:GITHUB_PATH
          } else {
            echo "$env:APPDATA\Python\Scripts" >> $env:GITHUB_PATH
            Write-Host "Poetry is already installed at $poetryPath"
          }

      - name: Install dependencies with Poetry
        run: |
          # 配置Poetry使用项目内的虚拟环境
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          
          # 安装项目依赖
          poetry lock
          poetry install --no-interaction --no-root
          
          # 版本信息写入
          poetry run python suan/scripts/run_write_version.py

      - name: build exe
        run: |
          # 使用Poetry运行命令，无需手动激活环境
          cd suan\gui
          poetry run python build.py --clean

      - name: Install NSIS
        if: ${{ false }}
        run: |
          iwr -useb get.scoop.sh -outfile 'install.ps1' # 从 get.scoop.sh 下载 install.ps1 脚本
          .\install.ps1 -RunAsAdmin # 以管理员权限运行 install.ps1 脚本
          scoop update
          scoop bucket add extras

        # scoop install nsis
      - name: build app
        if: ${{ false }}
        run: |
          makensis suan\gui\build_nsis.nsi
          cd suan\gui\dist
          ls

      - name: Upload files to OSS(window)
        if: ${{ false }}
        env:
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          OSS_ACCESS_KEY_ID: ${{ secrets.KEY }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.SECRET }}
          OSS_BUCKET: sijin-suan-update
          # 指定要上传的文件或目录
          SOURCE_DIR: '../src/dist'
          # 指定OSS中的目标目录
          TARGET_DIR: 'nsis/'
        run: |
          pwd
          pip install oss2
          python suan\scripts\deploy.py
          python suan\scripts\update.py


      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          # 上传后的标记名，下载依靠它找到对应文件
          name: stk_windows
          # 上传的文件位置
          #          path: suan/gui/dist/stk_nsis.exe
          path: suan/gui/dist/stk_windows.exe

  release:
    needs:
      - windows_build
      # - macOS_build    # Temporarily commented out
      # - ubuntu_build   # Temporarily commented out
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3
      - name: get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_OUTPUT"
          echo "The TAG is $steps.get_tag.outputs.TAG"

      - name: Create Release
        if: github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          release_name: ${{ steps.get_tag.outputs.TAG}}
          # body: |
          #   Release  ${{ steps.get_tag.outputs.TAG }}
          # draft: true
          # prerelease: false

      - name: Download ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_ubuntu
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download windows app
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_windows
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_macos
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/
      - run: |
          cd suan/gui/dist/
          ls

      - name: release ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_ubuntu
          asset_name: stk_ubuntu
          asset_content_type: application/octet-stream

      - name: release windows app
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          #          asset_path: suan/gui/dist/stk_nsis.exe
          asset_path: suan/gui/dist/stk_windows.exe
          asset_name: stk_windows.exe
          asset_content_type: application/octet-stream

      - name: release macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_macos
          asset_name: stk_macos
          asset_content_type: application/octet-stream
