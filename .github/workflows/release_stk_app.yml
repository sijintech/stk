name: Build and Release App
on:
  push:
    tags:
      - 'v*'

jobs:
  ubuntu_build:
    if: false  # Temporarily disabled
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      - name: Setup virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Build executable
        run: |
          python -m pip install -U pip
          python suan/scripts/run_write_version.py
          cd suan/gui/
          pip install pyinstaller==6.3.0
          pip install PySide6
          pip install matplotlib
          pip install pandas
          pip install numpy
          pip install requests          
          pip install toml
          pip install vtk
          pyinstaller ./main.spec
          cd dist
          ls

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          name: stk_ubuntu
          path: suan/gui/dist/stk_ubuntu

  macOS_build:
    if: false  # Temporarily disabled
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_ENV"

      - name: Setup virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
      - name: build exe
        run: |
          python -m pip install -U pip
          python suan/scripts/run_write_version.py
          cd suan/gui/
          pip install vtk==9.3.0
          pip install pyinstaller==6.3.0
          pip install PySide6
          pip install matplotlib
          pip install pandas
          pip install numpy
          pip install requests
          pip install toml
          pyinstaller ./main.spec
          cd dist
          ls

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          # 上传后的标记名，下载依靠它找到对应文件
          name: stk_macos
          # 上传的文件位置
          path: suan/gui/dist/stk_macos

  windows_build:
    runs-on: [ self-hosted, Windows ]

    steps:
      - uses: actions/checkout@v3
      
      - name: Check Python Version
        run: |
          python --version
          echo "Using system Python to avoid permission issues"

      # 添加缓存机制
      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\.cache\pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: get tag
        id: get_tag
        run: |
          # 修正Windows环境下的环境变量设置方式
          echo "TAG=$($env:GITHUB_REF -replace 'refs/tags/v','')" >> $env:GITHUB_ENV

      - name: Setup virtual environment
        run: |
          # 检查缓存的虚拟环境是否存在
          if (Test-Path .venv\Scripts\activate.ps1) {
            echo "Using cached virtual environment"
          } else {
            echo "Creating new virtual environment"
            python -m venv .venv
          }
          
          # 激活虚拟环境
          .\.venv\Scripts\activate.ps1
          
          # 更新pip并设置超时时间
          python -m pip install --upgrade pip --timeout 1800
          
          # 使用全路径安装poetry并添加到PATH
          python -m pip install poetry==1.7.1 --timeout 1800
          
          # 显示安装位置并确认poetry安装成功
          $poetryPath = (Get-Command -ErrorAction SilentlyContinue python).Path | Split-Path -Parent
          echo "Poetry should be installed at: $poetryPath\Scripts\poetry.exe"
          
          # 检查poetry是否在PATH中
          if (Test-Path "$poetryPath\Scripts\poetry.exe") {
            echo "Poetry executable found"
            # 直接使用完整路径执行poetry
            & "$poetryPath\Scripts\poetry.exe" --version
            & "$poetryPath\Scripts\poetry.exe" config virtualenvs.create false
            & "$poetryPath\Scripts\poetry.exe" install --no-interaction --no-root
          } else {
            echo "Poetry not found, using direct pip installation for required packages"
            # 如果poetry未找到，使用pip直接安装必要的依赖
            pip install pyinstaller==6.3.0 PySide6 vtk matplotlib pandas numpy requests toml --timeout 180
          }

      - name: build exe
        run: |
          # 重新激活虚拟环境，确保路径正确
          .\.venv\Scripts\activate.ps1
          
          # 如果上一步成功安装了poetry，它的可执行文件应该已经在PATH中
          python.exe -m pip install -U pip
          python suan\scripts\run_write_version.py
          cd suan\gui

          # pip install PySide6
          # pip install vtk==9.3.0
          # python -c "import vtk"
          # pip install matplotlib
          # pip install pandas
          # pip install numpy
          # pip install requests
          # pip install toml

          pyinstaller .\main.spec

          
          # - name: Install NSIS
          #   run: |
          # iwr -useb get.scoop.sh -outfile 'install.ps1' # 从 get.scoop.sh 下载 install.ps1 脚本
          # .\install.ps1 -RunAsAdmin # 以管理员权限运行 install.ps1 脚本
          # scoop update
          # scoop bucket add extras

        # scoop install nsis
      #      - name: build app
      #        run: |
      #          makensis suan\gui\build_nsis.nsi
      #          cd suan\gui\dist
      #          ls

      # - name: Upload files to OSS(window)
      #   env:
      #     OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
      #     OSS_ACCESS_KEY_ID: ${{ secrets.KEY }}
      #     OSS_ACCESS_KEY_SECRET: ${{ secrets.SECRET }}
      #     OSS_BUCKET: sijin-suan-update
      #     # 指定要上传的文件或目录
      #     SOURCE_DIR: '../src/dist'
      #     # 指定OSS中的目标目录
      #     TARGET_DIR: 'nsis/'
      #   run: |
      #     pwd
      #     pip install oss2
      #     python suan\scripts\deploy.py
      #     python suan\scripts\update.py

      - name: Check build output
        run: |
          # 检查构建产物是否存在，避免使用中文
          if (Test-Path suan\gui\dist\stk_windows.exe) {
            echo "Build artifact generated, size: $((Get-Item suan\gui\dist\stk_windows.exe).length / 1MB) MB"
          } else {
            echo "Build artifact not found, please check the build process"
            exit 1
          }

      - name: Store dist
        uses: actions/upload-artifact@v4
        with:
          # 上传后的标记名，下载依靠它找到对应文件
          name: stk_windows
          # 上传的文件位置
          #          path: suan/gui/dist/stk_nsis.exe
          path: suan/gui/dist/stk_windows.exe

  release:
    needs:
      - windows_build
      # - macOS_build    # Temporarily commented out
      # - ubuntu_build   # Temporarily commented out
    runs-on: [ self-hosted, Linux ]

    steps:
      - uses: actions/checkout@v3
      - name: get tag
        id: get_tag
        run: |
          echo "TAG=$(echo $GITHUB_REF | sed 's|refs/tags/v||')" >> "$GITHUB_OUTPUT"
          echo "The TAG is $steps.get_tag.outputs.TAG"

      - name: Create Release
        if: github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          release_name: ${{ steps.get_tag.outputs.TAG}}
          # body: |
          #   Release  ${{ steps.get_tag.outputs.TAG }}
          # draft: true
          # prerelease: false

      - name: Download ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_ubuntu
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download windows app
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_windows
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/

      - name: Download macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过下载
        uses: actions/download-artifact@v4
        with:
          # 要下载的文件的标记
          name: stk_macos
          # 下载到哪个目录（注意是/而不是\,否则报错）
          path: suan/gui/dist/
      - run: |
          cd suan/gui/dist/
          ls

      - name: release ubuntu app
        if: ${{ false }}  # 当前禁用了Ubuntu构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_ubuntu
          asset_name: stk_ubuntu
          asset_content_type: application/octet-stream

      - name: release windows app
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          #          asset_path: suan/gui/dist/stk_nsis.exe
          asset_path: suan/gui/dist/stk_windows.exe
          asset_name: stk_windows.exe
          asset_content_type: application/octet-stream

      - name: release macOS app
        if: ${{ false }}  # 当前禁用了macOS构建，暂时跳过发布
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: suan/gui/dist/stk_macos
          asset_name: stk_macos
          asset_content_type: application/octet-stream

