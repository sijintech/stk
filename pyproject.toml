[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "suan_toolkits"
version = "0.0.0"
description = "This is a tool to vtk and matploblib."
readme = "README.md"
authors = ["Zhou Hanjie <2625553453@qq.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = "1.24.3"
toml = ">=0.8.2"
matplotlib = "3.6.2"
PySide6 = "6.4.1"
vtk = "9.3.0"
requests = "*"
pandas = "*"
ollama = "*"
sentence-transformers = "4.0.1"
PyPDF2 = "*"
chardet = "*"
qtpy = "*"
pygments = "*"
pyinstaller = "6.3.0"
frontend = "*"
pathspec= "*"
psutil = "*"  
pyinstaller-hooks-contrib = "*"
tqdm = ">=4.27"

# 添加 PyTorch 官方源
[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/"
priority = "supplemental"

[tool.poetry.urls]
Homepage = "https://github.com/sijintech/stk.git"
Issues = "https://github.com/sijintech/stk/issues/"

# 打包和开发工具，放在可选依赖中
[tool.poetry.group.dev.dependencies]
pyinstaller = "6.3.0"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

# 添加脚本命令
[tool.poetry.scripts]
build-app = "suan.gui.packaging.builder:main"
extract-deps = "suan.gui.packaging.dependencies:extract_dependencies"
generate-hooks = "suan.gui.packaging.hooks_generator:main"

# PyInstaller配置
[tool.pyinstaller]
# 钩子目录
hooks_dir = "suan/gui/pkg_tools/hooks"
# 集中管理的所有隐藏导入
hidden_imports = [
    # GUI组件
    "left_sidebar", "right_sidebar", "toolbar", "statusbar", "info_bar",
    "center_widget", "custom_logger", "version", "Tab",
    # 核心Python库
    "numpy.core._methods", "numpy.lib.format", "chardet",
    # 通用依赖
    "requests", "toml", "tqdm",
    # 机器学习依赖
    "scipy", "scipy.special", "scipy.special._cdflib", "scipy.special._ufuncs",
    "sklearn", "sklearn.metrics", "sklearn.metrics.roc_curve", 
    "sklearn.utils", "sklearn.utils.validation",
    "transformers", "sentence_transformers"
]

# 按库分类的特定依赖配置
[tool.pyinstaller.PySide6]
modules = [
    "QtCore", "QtGui", "QtWidgets", "QtSvg", "QtXml", 
    "QtNetwork", "QtPrintSupport"
]

[tool.pyinstaller.matplotlib]
modules = [
    # Qt后端
    "backends.backend_qt5agg", "backends.backend_qtagg", 
    "backends.backend_qt5", "backends.backend_qt",
    "backends.qt_compat", "backends.qt_editor",
    # 其他后端
    "backends.backend_svg", "backends.backend_pdf", 
    "backends.backend_ps", "backends.backend_agg",
    "backends.backend_cairo", "backends.backend_tkagg", 
    "backends._backend_tk",
    # 核心模块
    "pyplot", "figure", "colors", "artist", "text", "image"
]

[tool.pyinstaller.vtk]
modules = [
    # vtk顶级模块
    "vtk", "vtk.vtkCommonCore", "vtk.vtkCommonCorePython",
    "vtk.vtkRenderingCorePython", "vtk.vtkFiltersCoreModule",
    "vtk.vtkIOXMLPython", "vtk.vtkInteractionStyle", 
    "vtk.vtkRenderingOpenGL2",
    
    # vtkmodules包及其重要子模块
    "vtkmodules", "vtkmodules.all", 
    "vtkmodules.qt.QVTKRenderWindowInteractor",
    "vtkmodules.util.numpy_support", "vtkmodules.util.execution_model", 
    "vtkmodules.util.data_model", "vtkmodules.util.colors",
    "vtkmodules.util.vtkAlgorithm", "vtkmodules.util.vtkConstants",
    "vtkmodules.util.misc", "vtkmodules.vtkCommonCore",
    "vtkmodules.vtkRenderingCore", "vtkmodules.vtkIOXML",
    "vtkmodules.vtkFiltersCore", "vtkmodules.vtkImagingCore",
    "vtkmodules.vtkRenderingOpenGL2", "vtkmodules.web"
]

[tool.pyinstaller.pandas]
modules = [
    "_libs.tslibs.timedeltas", "_libs.tslibs.nattype",
    "_libs.tslibs.np_datetime", "_libs.tslibs.base",
    "_libs.tslibs.conversion", "_libs.tslibs.fields",
    "_libs.tslibs.offsets", "_libs.tslibs.parsing",
    "_libs.tslibs.period", "_libs.tslibs.strptime",
    "_libs.tslibs.vectorized"
]

[tool.pyinstaller.scipy]
modules = [
    "special._cdflib",
    "special._ufuncs",
    "special._ellip_harm_2",
    "integrate",
    "integrate.quadrature",
    "integrate._quadpack",
    "_lib.messagestream"
]

[tool.pyinstaller.sklearn]
modules = [
    "metrics.roc_curve",
    "utils",
    "utils.validation",
    "utils._array_api",
    "utils._param_validation",
    "base"
]

[tool.pyinstaller.transformers]
modules = [
    "generation",
    "generation.utils",
    "generation.candidate_generator",
    "models.auto",
    "models.auto.modeling_auto",
    "models.auto.auto_factory"
]

[tool.pyinstaller.sentence_transformers]
modules = [
    "cross_encoder",
    "cross_encoder.CrossEncoder",
    "util"
]


