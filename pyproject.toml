[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "suan_toolkits"
version = "0.1.0a1"
description = "Scientific workflows with desktop, CLI and persistent local/cluster runtimes."
readme = "README.md"
authors = ["Zhou Hanjie <2625553453@qq.com>"]
packages = [
    { include = "suan" },
    # Specific source roots must precede the enclosing toolkit package: Poetry
    # deduplicates source files using the first package mapping encountered.
    { include = "structure_generator", from = "toolkits/smesh/src/structure-generator/src" },
    { include = "stk_data", from = "toolkits/smesh/src" },
    { include = "toolkits" },
]
exclude = ["toolkits/cpp/**", "toolkits/**/tests/**", "toolkits/**/test/**", "**/__pycache__/**", "**/*.pyc"]
include = [
    { path = "docs/runtime*.md", format = "sdist" },
    { path = "docs/specs", format = "sdist" },
    { path = "examples/runtime", format = "sdist" },
    { path = "deploy/systemd", format = "sdist" },
    { path = "tests", format = "sdist" },
    { path = "blender", format = "sdist" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
click = ">=8,<9"
psutil = ">=5.9,<8"
toml = ">=0.10,<1"
tomli = { version = ">=1.1,<3", python = "<3.11" }
numpy = { version = ">=1.24,<3", optional = true }
matplotlib = { version = ">=3.6,<4", optional = true }
PySide6 = { version = ">=6.4,<7", optional = true }
vtk = { version = ">=9.3,<10", optional = true }
requests = { version = ">=2.31,<3", optional = true }
pandas = { version = ">=2,<4", optional = true }
h5py = { version = ">=3.8,<4", optional = true }
ollama = { version = ">=0.4,<1", optional = true }
sentence-transformers = { version = ">=4,<6", optional = true }
PyPDF2 = { version = ">=3,<4", optional = true }
chardet = { version = ">=5,<6", optional = true }
qtpy = { version = ">=2,<3", optional = true }
pygments = { version = ">=2,<3", optional = true }
pyinstaller = { version = ">=6.3,<7", optional = true }
pathspec = { version = ">=0.12,<2", optional = true }
pyinstaller-hooks-contrib = { version = ">=2024", optional = true }
tqdm = { version = ">=4.27,<5", optional = true }
markdown = { version = ">=3,<4", optional = true }
packaging = { version = ">=23,<27", optional = true }
mcp = { version = ">=1,<2", optional = true }
pytest = { version = ">=8,<10", optional = true }
fastapi = { version = "==0.141.1", optional = true }
uvicorn = { version = ">=0.34,<1", optional = true }
httpx = { version = ">=0.28,<1", optional = true }
websockets = { version = "==15.0.1", optional = true }

[tool.poetry.extras]
server = []
science = ["numpy", "matplotlib", "pandas", "h5py"]
desktop = ["numpy", "matplotlib", "pandas", "h5py", "PySide6", "vtk", "requests", "chardet", "qtpy", "pygments", "pathspec", "tqdm", "markdown", "packaging"]
ai = ["ollama", "sentence-transformers", "PyPDF2", "requests"]
mcp = ["mcp", "numpy", "matplotlib"]
build = ["pyinstaller", "pyinstaller-hooks-contrib"]
test = ["pytest"]
control = ["fastapi", "uvicorn", "httpx", "websockets"]
visualization = ["numpy", "vtk", "h5py"]

# 添加 PyTorch 官方源
[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/"
priority = "supplemental"

[tool.poetry.urls]
Homepage = "https://github.com/sijintech/stk.git"
Issues = "https://github.com/sijintech/stk/issues/"

# 打包和开发工具，放在可选依赖中
[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.3,<7"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

# 添加脚本命令
[tool.poetry.scripts]
suan = "suan.cli.main:main"
suan-gui = "suan.gui.launcher:main"
suan-control = "suan.control.cli:control"
suan-node = "suan.control.cli:node"
suan-blender = "suan.blender_client.launcher:main"
suan-workbench = "suan.blender_client.launcher:main"
suan-synorder-node = "suan.runtime.synorder_node:main"
build-app = "suan.gui.pkg_tools.builder:main"
extract-deps = "suan.gui.pkg_tools.dependencies:main"
generate-hooks = "suan.gui.pkg_tools.hooks_generator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "desktop: requires PySide6/VTK and an offscreen Qt platform",
    "server: exercises the Linux-only STK server Runtime (API, supervisor, workers, schedulers)",
    "render: needs offscreen OpenGL (EGL or OSMesa); skipped unless `python -m suan.render.offscreen --probe` succeeds in a subprocess",
    "perf: performance targets measured on the reference host; excluded from default CI",
]

# PyInstaller配置
[tool.pyinstaller]
# 钩子目录
hooks_dir = "suan/gui/pkg_tools/hooks"
# 集中管理的所有隐藏导入
hidden_imports = [
    # GUI组件
    "left_sidebar", "right_sidebar", "toolbar", "statusbar", "info_bar",
    "center_widget", "custom_logger", "version", "Tab",
    # 核心Python库
    "numpy.core._methods", "numpy.lib.format", "chardet",
    # 通用依赖
    "requests", "toml", "tqdm",
    # 机器学习依赖
    "scipy", "scipy.special", "scipy.special._cdflib", "scipy.special._ufuncs",
    "sklearn", "sklearn.metrics", "sklearn.metrics.roc_curve", 
    "sklearn.utils", "sklearn.utils.validation",
    "transformers", "sentence_transformers"
]

# 按库分类的特定依赖配置
[tool.pyinstaller.PySide6]
modules = [
    "QtCore", "QtGui", "QtWidgets", "QtSvg", "QtXml", 
    "QtNetwork", "QtPrintSupport"
]

[tool.pyinstaller.matplotlib]
modules = [
    # Qt后端
    "backends.backend_qt5agg", "backends.backend_qtagg", 
    "backends.backend_qt5", "backends.backend_qt",
    "backends.qt_compat", "backends.qt_editor",
    # 其他后端
    "backends.backend_svg", "backends.backend_pdf", 
    "backends.backend_ps", "backends.backend_agg",
    "backends.backend_cairo", "backends.backend_tkagg", 
    "backends._backend_tk",
    # 核心模块
    "pyplot", "figure", "colors", "artist", "text", "image"
]

[tool.pyinstaller.vtk]
modules = [
    # vtk顶级模块
    "vtk", "vtk.vtkCommonCore", "vtk.vtkCommonCorePython",
    "vtk.vtkRenderingCorePython", "vtk.vtkFiltersCoreModule",
    "vtk.vtkIOXMLPython", "vtk.vtkInteractionStyle", 
    "vtk.vtkRenderingOpenGL2",
    
    # vtkmodules包及其重要子模块
    "vtkmodules", "vtkmodules.all", 
    "vtkmodules.qt.QVTKRenderWindowInteractor",
    "vtkmodules.util.numpy_support", "vtkmodules.util.execution_model", 
    "vtkmodules.util.data_model", "vtkmodules.util.colors",
    "vtkmodules.util.vtkAlgorithm", "vtkmodules.util.vtkConstants",
    "vtkmodules.util.misc", "vtkmodules.vtkCommonCore",
    "vtkmodules.vtkRenderingCore", "vtkmodules.vtkIOXML",
    "vtkmodules.vtkFiltersCore", "vtkmodules.vtkImagingCore",
    "vtkmodules.vtkRenderingOpenGL2", "vtkmodules.web"
]

[tool.pyinstaller.pandas]
modules = [
    "_libs.tslibs.timedeltas", "_libs.tslibs.nattype",
    "_libs.tslibs.np_datetime", "_libs.tslibs.base",
    "_libs.tslibs.conversion", "_libs.tslibs.fields",
    "_libs.tslibs.offsets", "_libs.tslibs.parsing",
    "_libs.tslibs.period", "_libs.tslibs.strptime",
    "_libs.tslibs.vectorized"
]

[tool.pyinstaller.scipy]
modules = [
    "special._cdflib",
    "special._ufuncs",
    "special._ellip_harm_2",
    "integrate",
    "integrate.quadrature",
    "integrate._quadpack",
    "_lib.messagestream"
]

[tool.pyinstaller.sklearn]
modules = [
    "metrics.roc_curve",
    "utils",
    "utils.validation",
    "utils._array_api",
    "utils._param_validation",
    "base"
]

[tool.pyinstaller.transformers]
modules = [
    "generation",
    "generation.utils",
    "generation.candidate_generator",
    "models.auto",
    "models.auto.modeling_auto",
    "models.auto.auto_factory"
]

[tool.pyinstaller.sentence_transformers]
modules = [
    "cross_encoder",
    "cross_encoder.CrossEncoder",
    "util"
]
