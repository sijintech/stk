[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "suan_toolkits"
version = "0.0.0"
description = "This is a tool to vtk and matploblib."
readme = "README.md"
authors = ["Zhou Hanjie <2625553453@qq.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = "1.24.3"
toml = ">=0.8.2"
matplotlib = "3.6.2"
PySide6 = "6.4.1"
vtk = "9.3.0"
requests = "*"
pandas = "*"
ollama = "*"
# 更改 torch 依赖为使用特定的 URL
#torch = { url = "https://download.pytorch.org/whl/cu117/torch-1.13.1%2Bcu117-cp39-cp39-win_amd64.whl" }
#transformers = "4.30.2"
sentence-transformers = "4.0.1"
PyPDF2 = "*"
chardet = "*"
qtpy = "*"
pygments = "*"
pyinstaller = "6.3.0"
frontend = "*"
pathspec= "*"
psutil = "*"  
# 添加 PyTorch 官方源
[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/"
priority = "supplemental"

[tool.poetry.urls]
Homepage = "https://github.com/sijintech/stk.git"
Issues = "https://github.com/sijintech/stk/issues/"

# 打包和开发工具，放在可选依赖中
[tool.poetry.group.dev.dependencies]
pyinstaller = "6.3.0"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

# PyInstaller配置
[tool.pyinstaller]
# 打包相关的配置
hooks_dir = "suan/gui/hooks"
hidden_imports = [
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
    "PySide6.QtSvg",
    "PySide6.QtNetwork",
    "matplotlib.backends.backend_qt5agg",
    "numpy.core._methods",
    "numpy.lib.format",
    "pandas._libs.tslibs.timedeltas",
    "pandas._libs.tslibs.nattype",
    "pandas._libs.tslibs.np_datetime",
    "vtk.vtkIOXMLPython",
    "vtk.vtkRenderingCorePython",
    "vtk.vtkCommonCorePython",
    "vtk.vtkFiltersCoreModule",
    "vtkmodules.util.execution_model", 
    "vtkmodules.util.data_model"
]

# 添加自动命令
[tool.poetry.scripts]
generate-deps = "suan.gui.update_dependencies:main"
build-app = "suan.gui.build_with_poetry:main"
