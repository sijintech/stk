[package]
name = "stk-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "stk_workbench"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "stk-workbench"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe"]
ohos = []

[dependencies]
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
pollster = "0.4"
raw-window-handle = "0.6"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
